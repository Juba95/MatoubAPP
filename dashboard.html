<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBN Manager</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b12;--card:#12121c;--border:#1e1e2e;--accent:#c9a227;--text:#e8e8f0;--muted:#6b6b80;--danger:#ef4444;--success:#22c55e;--warn:#f59e0b;--mono:'JetBrains Mono',monospace;--body:'DM Sans',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:12px}
input,select{width:100%;padding:10px 12px;background:#1a1a28;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:var(--body);outline:none;box-sizing:border-box}
input:focus,select:focus{border-color:var(--accent)}
.btn{padding:10px 20px;background:var(--accent);color:#0b0b12;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--body)}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.btn2{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--body)}
.btn2:hover{border-color:var(--text);color:var(--text)}
.btn-sm{font-size:11px;padding:4px 12px;border-radius:6px}
.btn-success{background:var(--success);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--body)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;letter-spacing:.5px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;display:inline-block}
.metrics{display:flex;gap:10px;margin-bottom:20px}
.metric{background:#1a1a28;border-radius:8px;padding:12px 16px;flex:1;min-width:0}
.metric-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.metric-val{font-size:22px;font-weight:600;font-family:var(--mono)}
.metric-sub{font-size:11px;margin-top:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--body);transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.site-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.site-stats{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-shrink:0}
.site-stats b{font-weight:500;color:var(--text)}
.action-row{display:flex;align-items:flex-start;gap:12px}
.action-score{font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0}
.log-box{background:#080810;font-family:var(--mono);font-size:12px;max-height:300px;overflow-y:auto;padding:12px;border-radius:8px}
.log-ok{color:#a0ffa0}.log-err{color:var(--danger)}.log-win{color:var(--success)}
.region-btn{transition:all .15s}.region-btn.on{background:rgba(201,162,39,.13);border-color:var(--accent);color:var(--accent)}
.up{color:var(--success);font-size:12px;font-weight:500}.down{color:var(--danger);font-size:12px;font-weight:500}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{width:360px;padding:32px}
.login-title{font-size:28px;font-weight:700;color:var(--accent);font-family:var(--mono);letter-spacing:-1px;text-align:center}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:24px}
.error{color:var(--danger);font-size:12px;margin-bottom:12px}
.hidden{display:none}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:16px;font-weight:500;margin-bottom:10px}
.mt-24{margin-top:24px}
.mb-10{margin-bottom:10px}
.mb-12{margin-bottom:12px}
.mb-16{margin-bottom:16px}
.text-center{text-align:center}
.flex-gap-6{display:flex;gap:6px;margin-top:8px}
.flex-gap-8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-gap-10{display:flex;gap:10px}
.preview-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.preview-meta{color:var(--muted);font-size:11px}
.wrap-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wrap-btns-sm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.accent-title{font-size:13px;font-weight:500;color:var(--accent);margin-bottom:10px}
.result-box{border-color:var(--success)}
.result-msg{color:var(--success);font-weight:500}
.result-sub{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
<div class="card login-box">
<div class="login-title">PBN</div>
<div class="login-sub">Manager v1.0</div>
<label>Email</label>
<input id="login-email" placeholder="admin@pbn.local" style="margin-bottom:12px">
<label>Mot de passe</label>
<input id="login-pass" type="password" style="margin-bottom:16px">
<div id="login-err" class="error hidden"></div>
<button class="btn" style="width:100%" onclick="doLogin()">Se connecter</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="container">
<div class="flex-between" style="margin-bottom:16px">
<div style="display:flex;align-items:baseline;gap:8px">
<span style="font-size:20px;font-weight:700;color:var(--accent);font-family:var(--mono);letter-spacing:-1px">PBN</span>
<span style="font-size:14px;color:var(--muted)">Manager</span>
</div>
</div>
<div class="tabs">
<button class="tab active" onclick="switchTab(0,this)">Overview</button>
<button class="tab" onclick="switchTab(1,this)">Générateur WP</button>
<button class="tab" onclick="switchTab(2,this)">Pages géoloc.</button>
<button class="tab" onclick="switchTab(3,this)">Paramètres</button>
</div>
<div id="tab-0"></div>
<div id="tab-1" class="hidden"></div>
<div id="tab-2" class="hidden"></div>
<div id="tab-3" class="hidden"></div>
</div>
</div>

<script>
const API='';
let TOKEN=localStorage.getItem('pbn_token');

async function apiFetch(path,opts={}){
const h={'Content-Type':'application/json'};
if(TOKEN)h['Authorization']='Bearer '+TOKEN;
const r=await fetch(API+path,{...opts,headers:h});
if(r.status===401){localStorage.removeItem('pbn_token');location.reload();}
return r.json();
}
const fmt=n=>n!=null?Number(n).toLocaleString('fr-FR'):'\u2014';
const deltaHtml=v=>{if(!v||v===0)return'';const p=v>0;return `<span class="${p?'up':'down'}">${p?'+':''}${Number(v).toFixed(1)}</span>`;};
const pillHtml=(text,color)=>`<span class="pill" style="background:${color}18;color:${color}">${text}</span>`;

// LOGIN
async function doLogin(){
const email=document.getElementById('login-email').value;
const pass=document.getElementById('login-pass').value;
const errEl=document.getElementById('login-err');
errEl.classList.add('hidden');
try{
const d=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
if(d.access_token){TOKEN=d.access_token;localStorage.setItem('pbn_token',TOKEN);showDashboard();}
else{errEl.textContent='Identifiants invalides';errEl.classList.remove('hidden');}
}catch(e){errEl.textContent='Erreur de connexion';errEl.classList.remove('hidden');}
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function showDashboard(){
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
loadOverview();
}

function switchTab(n,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
for(let i=0;i<4;i++)document.getElementById('tab-'+i).classList.toggle('hidden',i!==n);
if(n===0)loadOverview();
if(n===1)loadGenerator();
if(n===2)loadGeoloc();
if(n===3)loadSettings();
}

// OVERVIEW
async function loadOverview(){
const[ov,sites,actions]=await Promise.all([apiFetch('/overview/'),apiFetch('/sites/'),apiFetch('/actions/')]);
let h=`<div class="metrics">
<div class="metric"><div class="metric-label">Sites actifs</div><div class="metric-val">${ov.total_sites}</div></div>
<div class="metric"><div class="metric-label">Pages totales</div><div class="metric-val">${fmt(ov.total_pages)}</div></div>
<div class="metric"><div class="metric-label">Position moy.</div><div class="metric-val">${ov.avg_position||'\u2014'}</div><div class="metric-sub">${deltaHtml(ov.position_delta)}</div></div>
<div class="metric"><div class="metric-label">Actions en attente</div><div class="metric-val">${ov.pending_actions}</div><div class="metric-sub" style="font-size:11px;color:var(--muted)">${ov.pending_optimizations} optim. / ${ov.pending_creations} contenus</div></div>
</div>`;

h+=`<div class="flex-between mb-10"><div class="section-title">Mes sites</div><button class="btn2" onclick="toggleAddSite()">+ Ajouter</button></div>`;
h+=`<div id="add-site-form" class="hidden"><div class="card grid2" style="gap:10px">
<div><label>Nom</label><input id="ns-name" placeholder="Mon site santé"></div>
<div><label>Domaine</label><input id="ns-domain" placeholder="sante-guide.fr"></div>
<div><label>Niche</label><input id="ns-niche" placeholder="santé naturelle"></div>
<div><label>Hébergeur</label><input id="ns-host" placeholder="hetzner, ovh..."></div>
<div><label>Ton éditorial</label><select id="ns-tone"><option value="conversationnel">Conversationnel</option><option value="journalistique">Journalistique</option><option value="technique">Technique</option><option value="commercial">Commercial</option><option value="academique">Académique</option></select></div>
<div style="display:flex;align-items:flex-end"><button class="btn" onclick="addSite()">Créer le site</button></div>
</div></div>`;

if(sites.length===0){h+=`<div class="card text-center" style="color:var(--muted)">Aucun site \u2014 clique "+ Ajouter"</div>`;}
else{sites.forEach(si=>{
const col=si.position_delta>0?'var(--success)':si.position_delta<-3?'var(--danger)':'var(--warn)';
const label=si.position_delta>0?'+'+si.position_delta:si.position_delta<-3?si.position_delta+' pos.':'Stable';
h+=`<div class="card">
<div class="site-row" onclick="toggleSiteConfig(${si.id})" style="cursor:pointer">
<div class="site-dot" style="background:${col}"></div>
<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${si.name}</div><div style="font-size:11px;color:var(--muted)">${si.domain} \u2014 ${si.host_provider||'non config.'}</div></div>
<div class="site-stats"><div><b>${si.total_pages}</b> pages</div><div><b>${si.avg_position||'\u2014'}</b> pos.</div></div>
${pillHtml(label,col)}
<span style="font-size:12px;color:var(--muted);margin-left:8px;cursor:pointer" title="Configurer">\u2699</span>
</div>
<div id="site-cfg-${si.id}" class="hidden" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
<div class="accent-title">Connexion WordPress</div>
<div class="grid2 mb-12">
<div><label>URL Admin WP</label><input id="sc-url-${si.id}" placeholder="https://${si.domain}/wp-admin/" value="${si.wp_admin_url||''}"></div>
<div><label>Username WP</label><input id="sc-user-${si.id}" placeholder="admin" value="${si.wp_username||''}"></div>
<div><label>Application Password</label><input id="sc-pass-${si.id}" type="password" placeholder="xxxx xxxx xxxx xxxx" value="${si.wp_app_password||''}"></div>
<div><label>Plugin SEO</label><select id="sc-seo-${si.id}"><option value="yoast" ${si.wp_seo_plugin==='yoast'?'selected':''}>Yoast</option><option value="rankmath" ${si.wp_seo_plugin==='rankmath'?'selected':''}>Rank Math</option><option value="seopress" ${si.wp_seo_plugin==='seopress'?'selected':''}>SEOPress</option></select></div>
</div>
<div class="accent-title">Profil \u00e9ditorial (anti-footprint)</div>
<div class="grid2 mb-12">
<div><label>Ton</label><select id="sc-tone-${si.id}"><option value="conversationnel" ${si.editorial_tone==='conversationnel'?'selected':''}>Conversationnel</option><option value="journalistique" ${si.editorial_tone==='journalistique'?'selected':''}>Journalistique</option><option value="technique" ${si.editorial_tone==='technique'?'selected':''}>Technique</option><option value="commercial" ${si.editorial_tone==='commercial'?'selected':''}>Commercial</option><option value="academique" ${si.editorial_tone==='academique'?'selected':''}>Acad\u00e9mique</option></select></div>
<div><label>Th\u00e8me WP</label><input id="sc-theme-${si.id}" placeholder="flavor flavor flavor" value="${si.wp_theme||''}"></div>
</div>
<div class="flex-gap-10">
<button class="btn btn-sm" onclick="saveSiteConfig(${si.id})">Sauvegarder</button>
<button class="btn2 btn-sm" onclick="testWPConn(${si.id})">Tester connexion WP</button>
</div>
<div id="sc-msg-${si.id}" style="margin-top:8px;font-size:12px"></div>
</div>
</div>`;});}

h+=`<div class="flex-between mt-24 mb-10"><div class="section-title">File de validation (${actions.length})</div>`;
if(actions.length>0)h+=`<button class="btn2" onclick="validateAll([${actions.map(a=>a.id).join(',')}])">Tout valider</button>`;
h+=`</div>`;

if(actions.length===0){h+=`<div class="card text-center" style="color:var(--muted)">Aucune action en attente</div>`;}
else{actions.forEach(a=>{
const typeLabel=a.action_type==='optimize'?'Optimisation':a.action_type==='geoloc'?'Géoloc':'Nouveau';
const typeColor=a.action_type==='optimize'?'#3b82f6':'#a855f7';
h+=`<div class="card action-row">
<div style="flex:1"><div style="font-size:13px;font-weight:500;margin-bottom:4px">${a.title}</div>
<div class="flex-gap-8">${pillHtml(typeLabel,typeColor)}${a.impressions>0?`<span style="font-size:11px;color:var(--muted)">Vol. ${fmt(a.impressions)}</span>`:''}</div>
<div class="flex-gap-6"><button class="btn2 btn-sm" onclick="rejectAction(${a.id})">Rejeter</button><button class="btn-success btn-sm" onclick="validateAction(${a.id})">Valider</button></div>
</div>
<div class="action-score">${fmt(Math.round(a.impact_score))}</div>
</div>`;});}

document.getElementById('tab-0').innerHTML=h;
}

function toggleAddSite(){document.getElementById('add-site-form').classList.toggle('hidden');}

async function addSite(){
const d={name:document.getElementById('ns-name').value,domain:document.getElementById('ns-domain').value,niche:document.getElementById('ns-niche').value,host_provider:document.getElementById('ns-host').value,editorial_tone:document.getElementById('ns-tone').value};
await apiFetch('/sites/',{method:'POST',body:JSON.stringify(d)});
loadOverview();
}

async function validateAction(id){await apiFetch(`/actions/${id}/validate`,{method:'POST'});loadOverview();}
async function rejectAction(id){await apiFetch(`/actions/${id}/reject`,{method:'POST'});loadOverview();}
async function validateAll(ids){await apiFetch('/actions/validate-batch',{method:'POST',body:JSON.stringify(ids)});loadOverview();}

function toggleSiteConfig(id){document.getElementById('site-cfg-'+id).classList.toggle('hidden');}

async function saveSiteConfig(id){
const data={
wp_admin_url:document.getElementById('sc-url-'+id).value,
wp_username:document.getElementById('sc-user-'+id).value,
wp_app_password:document.getElementById('sc-pass-'+id).value,
wp_seo_plugin:document.getElementById('sc-seo-'+id).value,
editorial_tone:document.getElementById('sc-tone-'+id).value,
wp_theme:document.getElementById('sc-theme-'+id).value
};
await apiFetch('/sites/'+id,{method:'PUT',body:JSON.stringify(data)});
const msg=document.getElementById('sc-msg-'+id);
msg.innerHTML='<span style="color:var(--success)">\u2713 Sauvegard\u00e9</span>';
setTimeout(()=>{msg.innerHTML='';},3000);
}

async function testWPConn(id){
const msg=document.getElementById('sc-msg-'+id);
msg.innerHTML='<span style="color:var(--muted)">Test en cours...</span>';
try{
const r=await apiFetch('/generator/test-connection/'+id,{method:'POST'});
if(r.ok)msg.innerHTML='<span style="color:var(--success)">\u2713 Connexion WP OK !</span>';
else msg.innerHTML='<span style="color:var(--danger)">\u2717 Erreur : '+r.error+'</span>';
}catch(e){msg.innerHTML='<span style="color:var(--danger)">\u2717 Erreur de connexion</span>';}
}

// GENERATOR
async function loadGenerator(){
const sites=await apiFetch('/sites/');
let h=`<div class="section-title mb-12">Générateur WordPress</div><div class="card">
<label>Site cible</label><select id="gen-site" style="margin-bottom:16px" onchange="showGenForm()"><option value="">Sélectionner...</option>`;
sites.forEach(s=>{h+=`<option value="${s.id}">${s.name} \u2014 ${s.domain}</option>`;});
h+=`</select><div id="gen-form" class="hidden">
<div class="accent-title">FTP</div>
<div class="grid2 mb-16"><div><label>Host</label><input id="g-ftp-host"></div><div><label>User</label><input id="g-ftp-user"></div><div><label>Password</label><input id="g-ftp-pass" type="password"></div><div><label>WP User</label><input id="g-wp-user" value="admin"></div></div>
<div class="accent-title">MySQL</div>
<div class="grid2 mb-16"><div><label>Host</label><input id="g-db-host" placeholder="localhost"></div><div><label>Nom BDD</label><input id="g-db-name"></div><div><label>User</label><input id="g-db-user"></div><div><label>Password</label><input id="g-db-pass" type="password"></div></div>
<button class="btn" onclick="installWP()">Installer WordPress</button>
</div></div><div id="gen-logs"></div>`;
document.getElementById('tab-1').innerHTML=h;
}

function showGenForm(){
const v=document.getElementById('gen-site').value;
document.getElementById('gen-form').classList.toggle('hidden',!v);
}

async function installWP(){
const sid=document.getElementById('gen-site').value;
if(!sid)return;
const cfg={ftp_host:document.getElementById('g-ftp-host').value,ftp_user:document.getElementById('g-ftp-user').value,ftp_password:document.getElementById('g-ftp-pass').value,wp_username:document.getElementById('g-wp-user').value,db_host:document.getElementById('g-db-host').value,db_name:document.getElementById('g-db-name').value,db_user:document.getElementById('g-db-user').value,db_password:document.getElementById('g-db-pass').value};
await apiFetch(`/sites/${sid}`,{method:'PUT',body:JSON.stringify(cfg)});
await apiFetch('/generator/install',{method:'POST',body:JSON.stringify({site_id:Number(sid)})});
const poll=setInterval(async()=>{
const d=await apiFetch(`/generator/logs/${sid}`);
let lh='<div class="card log-box">';
(d.logs||[]).forEach(l=>{const cls=l.startsWith('ERROR')?'log-err':l.startsWith('SUCCESS')?'log-win':'log-ok';lh+=`<div class="${cls}">${l}</div>`;});
lh+='</div>';
document.getElementById('gen-logs').innerHTML=lh;
if(d.logs?.some(l=>l.startsWith('SUCCESS')||l.startsWith('ERROR')))clearInterval(poll);
},2000);
}

// GEOLOC
let geoRegions=[],geoDepts=[],selRegs=[],selDepts=[],geoPreview=null;

async function loadGeoloc(){
const[sites,regions]=await Promise.all([apiFetch('/sites/'),apiFetch('/geoloc/regions')]);
geoRegions=regions;selRegs=[];selDepts=[];geoPreview=null;
let h=`<div class="section-title mb-12">Pages géolocalisées</div><div class="card">
<div class="grid2 mb-16">
<div><label>Site cible</label><select id="geo-site"><option value="">Sélectionner...</option>`;
sites.forEach(s=>{h+=`<option value="${s.id}">${s.name}</option>`;});
h+=`</select></div>
<div><label>Mot-clé (avec {ville})</label><input id="geo-kw" placeholder="serrurier {ville}"></div></div>
<div class="mb-16"><label>Population min : <span id="pop-val">5 000</span> hab.</label>
<input type="range" id="geo-pop" min="1000" max="50000" step="1000" value="5000" oninput="document.getElementById('pop-val').textContent=Number(this.value).toLocaleString('fr-FR')" style="width:100%;accent-color:var(--accent)"></div>
<div class="mb-16"><label>Régions</label><div class="wrap-btns" id="geo-regions">`;
regions.forEach(r=>{h+=`<button class="btn2 region-btn" style="font-size:11px;padding:4px 10px" onclick="toggleRegion('${r.replace(/'/g,"\\'")}',this)">${r}</button>`;});
h+=`</div></div><div class="mb-16 hidden" id="geo-depts-wrap"><label>Départements</label><div class="wrap-btns-sm" id="geo-depts"></div></div>
<div class="flex-gap-10"><button class="btn" onclick="previewGeoloc()">Prévisualiser</button><span id="geo-gen-btn"></span></div>
</div><div id="geo-result"></div><div id="geo-preview"></div>`;
document.getElementById('tab-2').innerHTML=h;
}

async function toggleRegion(r,el){
if(selRegs.includes(r)){selRegs=selRegs.filter(x=>x!==r);el.classList.remove('on');}
else{selRegs.push(r);el.classList.add('on');}
if(selRegs.length){
const all=[];for(const rr of selRegs){const d=await apiFetch(`/geoloc/departments?region=${encodeURIComponent(rr)}`);all.push(...d);}
geoDepts=[...new Set(all)].sort();
}else{geoDepts=await apiFetch('/geoloc/departments');}
selDepts=[];
const wrap=document.getElementById('geo-depts-wrap');
const cont=document.getElementById('geo-depts');
if(geoDepts.length){wrap.classList.remove('hidden');cont.innerHTML=geoDepts.map(d=>`<button class="btn2 region-btn" style="font-size:11px;padding:3px 8px;min-width:36px" onclick="toggleDept('${d}',this)">${d}</button>`).join('');}
else wrap.classList.add('hidden');
}

function toggleDept(d,el){
if(selDepts.includes(d)){selDepts=selDepts.filter(x=>x!==d);el.classList.remove('on');}
else{selDepts.push(d);el.classList.add('on');}
}

function geoBody(){
return{site_id:Number(document.getElementById('geo-site').value),keyword_template:document.getElementById('geo-kw').value,min_population:Number(document.getElementById('geo-pop').value),...(selRegs.length>0&&{regions:selRegs}),...(selDepts.length>0&&{departments:selDepts})};
}

async function previewGeoloc(){
if(!document.getElementById('geo-site').value||!document.getElementById('geo-kw').value)return;
geoPreview=await apiFetch('/geoloc/preview',{method:'POST',body:JSON.stringify(geoBody())});
document.getElementById('geo-gen-btn').innerHTML=`<button class="btn" style="background:var(--success)" onclick="generateGeoloc()">Générer ${geoPreview.total_pages} pages (~${geoPreview.estimated_cost_eur}\u20AC)</button>`;
let h=`<div class="card"><div style="font-size:14px;font-weight:500;margin-bottom:8px">${geoPreview.total_pages} pages \u2014 ~${geoPreview.estimated_cost_eur}\u20AC</div><div style="max-height:260px;overflow-y:auto">`;
geoPreview.pages.forEach(p=>{h+=`<div class="preview-row"><span>${p.keyword}</span><span class="preview-meta">${p.city} (${p.department}) \u2014 ${fmt(p.population)} hab.</span></div>`;});
if(geoPreview.total_pages>20)h+=`<div style="padding:8px;font-size:12px;color:var(--muted);text-align:center">... et ${geoPreview.total_pages-20} autres</div>`;
h+=`</div></div>`;
document.getElementById('geo-preview').innerHTML=h;
}

async function generateGeoloc(){
const res=await apiFetch('/geoloc/generate',{method:'POST',body:JSON.stringify(geoBody())});
document.getElementById('geo-result').innerHTML=`<div class="card result-box"><div class="result-msg">${res.message}</div><div class="result-sub">Les actions apparaissent dans la file de validation (Overview)</div></div>`;
}

// SETTINGS
function loadSettings(){
document.getElementById('tab-3').innerHTML=`
<div class="section-title mb-12">Paramètres</div>
<div class="card"><div class="accent-title">API Keys</div><div style="font-size:13px;color:var(--muted);line-height:1.7">Les clés API (DataForSEO, Claude, Replicate) se configurent dans les variables d'environnement de Coolify. Modifie-les là-bas et redéploie.</div></div>
<div class="card"><div class="accent-title">Compte admin</div><div style="font-size:13px;color:var(--muted)">Configurable via ADMIN_EMAIL et ADMIN_PASSWORD dans Coolify.</div></div>
<div class="card"><div style="font-size:13px;font-weight:500;color:var(--danger);margin-bottom:8px">Danger zone</div><button class="btn2 btn-danger" onclick="localStorage.removeItem('pbn_token');location.reload()">Se déconnecter</button></div>`;
}

// INIT
if(TOKEN){showDashboard();}
</script>
</body>
</html>
