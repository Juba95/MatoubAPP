<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatoubeAPP</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:#ffffff;--card2:#f0f0f5;--border:#e2e2ea;--accent:#6c5ce7;--accent2:#a29bfe;--text:#1a1a2e;--muted:#8888a0;--danger:#ff6b6b;--success:#51cf66;--warn:#fcc419;--orange:#ff922b;--blue:#339af0;--mono:'JetBrains Mono',monospace;--body:'Inter',system-ui,sans-serif;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:1080px;margin:0 auto;padding:24px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:12px;transition:border-color .2s}
input,select,textarea{width:100%;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--body);outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{padding:10px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn2{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--body);transition:all .15s}
.btn2:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{font-size:11px;padding:5px 12px;border-radius:6px}
.btn-success{background:var(--success);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--body);font-size:11px;padding:5px 14px;font-weight:600}
.btn-danger{border-color:var(--danger);color:var(--danger)}
label{font-size:11px;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:.3px;text-transform:uppercase;font-weight:500}
.pill{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block;letter-spacing:.3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.metric-val{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.metric-sub{font-size:11px;margin-top:4px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:10px;letter-spacing:1px;text-transform:uppercase}
.tabs{display:flex;gap:0;margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;overflow:hidden}
.tab{flex:1;padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:8px;cursor:pointer;font-family:var(--body);transition:all .2s;text-align:center}
.tab.active{color:#ffffff;background:var(--accent)}
.tab:hover:not(.active){color:var(--text);background:var(--card2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site-row{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;transition:all .2s}
.site-row:hover{border-color:var(--accent)!important;background:var(--card2)}
.site-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.site-stats{display:flex;gap:18px;font-size:11px;color:var(--muted);flex-shrink:0}
.site-stats b{font-weight:600;color:var(--text)}
.action-row{display:flex;align-items:flex-start;gap:14px;transition:all .2s}
.action-row:hover{border-color:var(--accent)!important}
.action-score{font-size:15px;font-weight:700;color:var(--accent);flex-shrink:0;font-family:var(--mono);min-width:50px;text-align:right}
.log-box{background:#f5f5f7;font-family:var(--mono);font-size:12px;max-height:300px;overflow-y:auto;padding:14px;border-radius:8px;border:1px solid var(--border)}
.log-ok{color:#2d7a3a}.log-err{color:var(--danger)}.log-win{color:var(--success)}
.region-btn{transition:all .15s}.region-btn.on{background:rgba(108,92,231,.15);border-color:var(--accent);color:var(--accent)}
.up{color:var(--success);font-size:11px;font-weight:600}.down{color:var(--danger);font-size:11px;font-weight:600}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#e8e8f0 0%,var(--bg) 70%)}
.login-box{width:380px;padding:40px;border:1px solid var(--border)}
.login-title{font-size:32px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:28px;letter-spacing:1px;text-transform:uppercase}
.error{color:var(--danger);font-size:12px;margin-bottom:12px}
.hidden{display:none}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px}
.mt-24{margin-top:28px}
.mb-10{margin-bottom:10px}
.mb-12{margin-bottom:12px}
.mb-16{margin-bottom:16px}
.text-center{text-align:center}
.flex-gap-6{display:flex;gap:6px;margin-top:8px}
.flex-gap-8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-gap-10{display:flex;gap:10px}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.preview-row:last-child{border-bottom:none}
.preview-meta{color:var(--muted);font-size:11px}
.wrap-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wrap-btns-sm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.accent-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.result-box{border-color:var(--success)}
.result-msg{color:var(--success);font-weight:600}
.result-sub{font-size:12px;color:var(--muted)}
.cfg-panel{background:var(--card2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:24px;margin-top:-12px;margin-bottom:12px}
.cfg-icon{font-size:16px;color:var(--muted);margin-left:8px;flex-shrink:0;transition:all .2s}
.site-row:hover .cfg-icon{color:var(--accent)}
.dist-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:10px}
.dist-bar>div{border-radius:3px;transition:width .3s}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
<div class="card login-box">
<div class="login-title">MatoubeAPP</div>
<div class="login-sub">SEO Automation</div>
<label>Email</label>
<input id="login-email" placeholder="admin@matoube.app" style="margin-bottom:12px">
<label>Mot de passe</label>
<input id="login-pass" type="password" style="margin-bottom:20px">
<div id="login-err" class="error hidden"></div>
<button class="btn" style="width:100%" onclick="doLogin()">Se connecter</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="container">
<header>
<div style="display:flex;align-items:center">
<span class="logo">MatoubeAPP</span>
<span class="logo-sub">SEO Automation</span>
</div>
<button class="btn2 btn-sm" onclick="localStorage.removeItem('pbn_token');location.reload()">Déconnexion</button>
</header>
<div class="tabs">
<button class="tab active" onclick="switchTab(0,this)">Overview</button>
<button class="tab" onclick="switchTab(1,this)">Générateur WP</button>
<button class="tab" onclick="switchTab(2,this)">Pages Géoloc</button>
<button class="tab" onclick="switchTab(3,this)">Paramètres</button>
</div>
<div id="tab-0"></div>
<div id="tab-1" class="hidden"></div>
<div id="tab-2" class="hidden"></div>
<div id="tab-3" class="hidden"></div>
</div>
</div>

<script>
const API='';
let TOKEN=localStorage.getItem('pbn_token');
let _openCfg=null;

async function apiFetch(path,opts={}){
const h={'Content-Type':'application/json'};
if(TOKEN)h['Authorization']='Bearer '+TOKEN;
let r;
try{r=await fetch(API+path,{...opts,headers:h});}
catch(e){throw new Error('Réseau indisponible');}
if(r.status===401){localStorage.removeItem('pbn_token');location.reload();return;}
if(!r.ok&&r.status!==401){const txt=await r.text().catch(()=>'');let msg;try{msg=JSON.parse(txt).detail||txt;}catch{msg=txt||r.statusText;}throw new Error(msg);}
return r.json();
}
const fmt=n=>n!=null?Number(n).toLocaleString('fr-FR'):'\u2014';
const deltaHtml=v=>{if(!v||v===0)return'';const p=v>0;return `<span class="${p?'up':'down'}">${p?'+':''}${Number(v).toFixed(1)}</span>`;};
const pillHtml=(text,color)=>`<span class="pill" style="background:${color}20;color:${color}">${text}</span>`;

// LOGIN
async function doLogin(){
const email=document.getElementById('login-email').value;
const pass=document.getElementById('login-pass').value;
const errEl=document.getElementById('login-err');
errEl.classList.add('hidden');
try{
const d=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
if(d.access_token){TOKEN=d.access_token;localStorage.setItem('pbn_token',TOKEN);showDashboard();}
else{errEl.textContent='Identifiants invalides';errEl.classList.remove('hidden');}
}catch(e){errEl.textContent='Erreur de connexion';errEl.classList.remove('hidden');}
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function showDashboard(){
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
loadOverview();
}

function switchTab(n,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
for(let i=0;i<4;i++)document.getElementById('tab-'+i).classList.toggle('hidden',i!==n);
if(n===0)loadOverview();
if(n===1)loadGenerator();
if(n===2)loadGeoloc();
if(n===3)loadSettings();
}

// OVERVIEW
async function loadOverview(){
_openCfg=null;
let sites,actions;
try{[sites,actions]=await Promise.all([apiFetch('/sites/'),apiFetch('/actions/')]);}
catch(e){document.getElementById('tab-0').innerHTML=`<div class="card" style="color:var(--danger)">Erreur chargement : ${e.message}</div>`;return;}

let h='';

// Bouton ajouter
h+=`<div class="flex-between mb-12"><div class="section-title" style="margin-bottom:0">Mes sites</div><button class="btn2 btn-sm" onclick="toggleAddSite()">+ Ajouter un site</button></div>`;
h+=`<div id="add-site-form" class="hidden" style="margin-bottom:16px"><div class="card grid2" style="gap:10px">
<div><label>Nom</label><input id="ns-name" placeholder="Mon site"></div>
<div><label>Domaine</label><input id="ns-domain" placeholder="monsite.fr"></div>
<div><label>Niche</label><input id="ns-niche" placeholder="plomberie, épaviste..."></div>
<div><label>Hébergeur</label><input id="ns-host" placeholder="OVH, Hetzner..."></div>
<div><label>Ton éditorial</label><select id="ns-tone"><option value="conversationnel">Conversationnel</option><option value="journalistique">Journalistique</option><option value="technique">Technique</option><option value="commercial">Commercial</option><option value="academique">Académique</option></select></div>
<div style="display:flex;align-items:flex-end"><button class="btn" onclick="addSite()">Créer</button></div>
</div></div>`;

if(sites.length===0){
h+=`<div class="card text-center" style="color:var(--muted);padding:32px">Aucun site \u2014 ajoute ton premier site</div>`;
} else {
// UN BLOC PAR SITE
sites.forEach(si=>{
const dd=si.distribution||{};
const hasData=si.total_keywords>0;
const deltaCol=si.position_delta>0?'var(--success)':si.position_delta<-3?'var(--danger)':'var(--muted)';

h+=`<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">`;

// Header du site (cliquable pour config)
h+=`<div class="site-row" id="site-row-${si.id}" onclick="toggleSiteConfig(${si.id})" style="padding:16px 22px;border-bottom:1px solid var(--border);border-radius:0">
<div class="site-dot" style="background:${si.sc_connected?'var(--success)':'var(--muted)'}"></div>
<div style="flex:1;min-width:0">
<div style="font-size:15px;font-weight:700">${si.name}${si.sc_connected?'':' <span style="font-size:9px;padding:2px 6px;background:var(--card2);border-radius:4px;color:var(--muted);font-weight:500">GSC non connecté</span>'}</div>
<div style="font-size:11px;color:var(--muted);margin-top:2px">${si.domain} \u2022 ${si.host_provider||'non config.'}</div>
</div>
<span class="cfg-icon" id="cfg-icon-${si.id}">\u2699\uFE0F</span>
<span style="font-size:14px;color:var(--muted);margin-left:2px;cursor:pointer;opacity:.4" title="Supprimer" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4" onclick="event.stopPropagation();confirmDeleteSite(${si.id},'${si.name.replace(/'/g,"\\'")}')">&#x1F5D1;</span>
</div>`;

// Config panel (hidden)
h+=`<div id="site-cfg-${si.id}" class="hidden"></div>`;

// Métriques du site
h+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);text-align:center;border-bottom:1px solid var(--border)">
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Pages indexées</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${fmt(si.indexed_pages||0)}</div></div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Mots-clés</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${fmt(si.total_keywords||0)}</div></div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Pos. moy.</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${si.avg_position||'\u2014'}</div>${si.position_delta?`<div style="font-size:11px;color:${deltaCol};font-weight:600">${si.position_delta>0?'+':''}${si.position_delta}</div>`:''}</div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Actions</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${si.pending_actions}</div></div>
<div style="padding:14px 8px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Distribution</div><div style="font-size:12px;font-family:var(--mono)"><span style="color:var(--success)">${dd.top_3||0}</span> <span style="color:var(--blue)">${dd.top_4_10||0}</span> <span style="color:var(--warn)">${dd.top_11_20||0}</span></div><div style="font-size:9px;color:var(--muted);margin-top:2px">top3 \u00B7 4-10 \u00B7 11-20</div></div>
</div>`;

// Opportunités + Drops côte à côte
if(hasData){
const opps=si.top_opportunities||[];
const drops=si.top_drops||[];
h+=`<div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:${(opps.length||drops.length)?'1px solid var(--border)':'none'}">`;

// Opportunités
h+=`<div style="padding:14px 18px;border-right:1px solid var(--border)">
<div style="font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:600;letter-spacing:.3px;margin-bottom:8px">Opportunités</div>`;
if(opps.length){opps.forEach(o=>{
h+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span>${o.keyword}</span><span style="color:var(--warn);font-weight:600;font-family:var(--mono)">pos.${Math.round(o.position)}</span></div>`;
});}else{h+=`<div style="font-size:11px;color:var(--muted)">Aucune</div>`;}
h+=`</div>`;

// Drops
h+=`<div style="padding:14px 18px">
<div style="font-size:10px;color:var(--danger);text-transform:uppercase;font-weight:600;letter-spacing:.3px;margin-bottom:8px">Baisses</div>`;
if(drops.length){drops.forEach(d=>{
h+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span>${d.keyword}</span><span style="color:var(--danger);font-weight:600;font-family:var(--mono)">${Math.round(d.from)}\u2192${Math.round(d.to)}</span></div>`;
});}else{h+=`<div style="font-size:11px;color:var(--muted)">Aucune</div>`;}
h+=`</div></div>`;
}

h+=`</div>`; // fin card site
});
}

// Actions
h+=`<div class="flex-between mt-24 mb-10"><div class="section-title">File de validation <span style="font-size:12px;color:var(--muted);font-weight:400">(${actions.length})</span></div>`;
if(actions.length>0)h+=`<button class="btn2 btn-sm" onclick="validateAll([${actions.map(a=>a.id).join(',')}])">Tout valider</button>`;
h+=`</div>`;

if(actions.length===0){h+=`<div class="card text-center" style="color:var(--muted);padding:24px">Aucune action en attente \u2014 lance un scan SEO</div>`;}
else{actions.forEach(a=>{
const typeLabel=a.action_type==='optimize'?'Optimisation':a.action_type==='geoloc'?'Géoloc':'Nouveau';
const typeColor=a.action_type==='optimize'?'var(--blue)':a.action_type==='create'?'var(--accent)':'var(--success)';
const posInfo=a.current_position&&a.previous_position?`${Math.round(a.previous_position)} \u2192 ${Math.round(a.current_position)}`:'';
const isFailed=a.status==='failed';
const isRunning=a.status==='executing'||a.status==='validated';
const statusPill=isFailed?pillHtml('ÉCHEC','var(--danger)'):isRunning?pillHtml('EN COURS','var(--orange)'):'';
const borderStyle=isFailed?'border-color:var(--danger)':isRunning?'border-color:var(--orange)':'';
h+=`<div class="card action-row" style="${borderStyle}">
<div style="flex:1">
<div style="font-size:13px;font-weight:700;margin-bottom:3px">${a.keyword||a.title} ${statusPill}</div>
<div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4">${(a.description||'').split('\\nERREUR:')[0]}</div>
${isFailed&&a.description&&a.description.includes('ERREUR:')?`<div style="font-size:11px;color:var(--danger);margin-bottom:8px;background:var(--card2);padding:8px;border-radius:6px;font-family:var(--mono);word-break:break-all">${a.description.split('ERREUR:').pop()}</div>`:''}
<div class="flex-gap-8">${pillHtml(typeLabel,typeColor)}${a.search_volume>0?`<span style="font-size:10px;color:var(--muted)">vol. ${fmt(a.search_volume)}</span>`:''}${posInfo?`<span class="down" style="font-size:10px">${posInfo}</span>`:''}</div>
<div style="display:flex;gap:6px;margin-top:10px">
<button class="btn2 btn-sm" onclick="rejectAction(${a.id})">Rejeter</button>
${isFailed?`<button class="btn-success" onclick="retryAction(${a.id})">Réessayer</button>`:`<button class="btn-success" onclick="validateAction(${a.id})">${isRunning?'En cours...':'Valider'}</button>`}
${(isRunning||isFailed)?`<button class="btn2 btn-sm" onclick="showActionLogs(${a.id})">Logs</button>`:''}
</div>
</div>
<div class="action-score">${fmt(Math.round(a.impact_score))}</div>
</div><div id="action-logs-${a.id}"></div>`;});}

document.getElementById('tab-0').innerHTML=h;
}

function toggleAddSite(){document.getElementById('add-site-form').classList.toggle('hidden');}

async function addSite(){
const d={name:document.getElementById('ns-name').value,domain:document.getElementById('ns-domain').value,niche:document.getElementById('ns-niche').value,host_provider:document.getElementById('ns-host').value,editorial_tone:document.getElementById('ns-tone').value};
if(!d.name||!d.domain)return;
try{await apiFetch('/sites/',{method:'POST',body:JSON.stringify(d)});
document.getElementById('ns-name').value='';document.getElementById('ns-domain').value='';document.getElementById('ns-niche').value='';document.getElementById('ns-host').value='';
document.getElementById('add-site-form').classList.add('hidden');
loadOverview();
}catch(e){alert('Erreur : '+(e.message||'impossible de créer le site'));}
}

async function validateAction(id){try{await apiFetch(`/actions/${id}/validate`,{method:'POST'});loadOverview();}catch(e){alert('Erreur validation : '+e.message);}}
async function retryAction(id){try{await apiFetch(`/actions/${id}/retry`,{method:'POST'});loadOverview();}catch(e){alert('Erreur retry : '+e.message);}}

function showActionLogs(id){
const container=document.getElementById('action-logs-'+id);
if(container.innerHTML){container.innerHTML='';return;}
container.innerHTML='<div class="log-box" style="margin-top:8px">Chargement...</div>';
const poll=setInterval(async()=>{
try{
const d=await apiFetch(`/actions/logs/${id}`);
let lh='<div class="log-box" style="margin-top:8px">';
(d.logs||[]).forEach(l=>{
const cls=l.startsWith('ERROR')?'log-err':l.startsWith('SUCCESS')?'log-win':l.startsWith('DONE')?'log-win':'log-ok';
lh+=`<div class="${cls}">${l}</div>`;
});
lh+='</div>';
container.innerHTML=lh;
if(d.logs?.some(l=>l.startsWith('DONE')||l.startsWith('ERROR')))clearInterval(poll);
}catch(e){clearInterval(poll);}
},1500);
}
async function rejectAction(id){try{await apiFetch(`/actions/${id}/reject`,{method:'POST'});loadOverview();}catch(e){alert('Erreur rejet : '+e.message);}}
async function validateAll(ids){try{await apiFetch('/actions/validate-batch',{method:'POST',body:JSON.stringify(ids)});loadOverview();}catch(e){alert('Erreur batch : '+e.message);}}

// ─── PANNEAU CONFIG SITE ─────────────────────────────────────────────────────

async function toggleSiteConfig(id){
const panel=document.getElementById('site-cfg-'+id);
const icon=document.getElementById('cfg-icon-'+id);
const row=document.getElementById('site-row-'+id);

if(_openCfg && _openCfg!==id){
const old=document.getElementById('site-cfg-'+_openCfg);
if(old)old.classList.add('hidden');
const oldIcon=document.getElementById('cfg-icon-'+_openCfg);
if(oldIcon)oldIcon.style.transform='';
const oldRow=document.getElementById('site-row-'+_openCfg);
if(oldRow)oldRow.style.borderRadius='';
}

if(!panel.classList.contains('hidden')){
panel.classList.add('hidden');
icon.style.transform='';
row.style.borderRadius='';
_openCfg=null;
return;
}

row.style.borderRadius='var(--radius) var(--radius) 0 0';
row.style.marginBottom='0';
icon.style.transform='rotate(90deg)';
_openCfg=id;

const si=await apiFetch('/sites/'+id);

panel.innerHTML=`<div class="cfg-panel">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
<button class="btn2 btn-sm" onclick="event.stopPropagation();testWP(${id})">Tester WP</button>
<button class="btn2 btn-sm" onclick="event.stopPropagation();scanSite(${id})">Scanner SEO</button>
<button class="btn2 btn-sm btn-danger" onclick="event.stopPropagation();if(confirm('Supprimer ce site ?'))deleteSite(${id})">Supprimer</button>
</div>
<div id="cfg-msg-${id}" style="margin-bottom:10px;font-size:12px;min-height:16px"></div>

<div class="accent-title">WordPress</div>
<div class="grid2 mb-16">
<div><label>URL Admin WP</label><input id="cf-wpadmin-${id}" value="${si.wp_admin_url||''}" placeholder="https://site.fr/wp-admin/"></div>
<div><label>Username WP</label><input id="cf-wpuser-${id}" value="${si.wp_username||''}"></div>
<div><label>Application Password</label><input id="cf-wppass-${id}" type="password" placeholder="laisser vide pour ne pas changer"></div>
<div><label>Plugin SEO</label><select id="cf-seoplug-${id}">
<option value="">--</option>
<option value="yoast"${si.wp_seo_plugin==='yoast'?' selected':''}>Yoast</option>
<option value="rankmath"${si.wp_seo_plugin==='rankmath'?' selected':''}>RankMath</option>
<option value="seopress"${si.wp_seo_plugin==='seopress'?' selected':''}>SEOPress</option>
</select></div>
</div>

<div class="accent-title">Search Console</div>
<div class="grid2 mb-16">
<div style="display:flex;align-items:flex-end;gap:8px">
${si.sc_connected
?`${pillHtml('Connecté','var(--success)')} <button class="btn2 btn-sm" onclick="event.stopPropagation();loadGSCProperties(${id})">Choisir propriété</button> <button class="btn2 btn-sm" onclick="event.stopPropagation();connectGSC(${id})">Reconnecter</button>`
:`<button class="btn2 btn-sm" onclick="event.stopPropagation();connectGSC(${id})">Connecter GSC</button>`}
</div>
<div><label>Propriété GSC</label><div id="cf-gsc-prop-${id}" style="font-size:12px;color:${si.sc_property?'var(--success)':'var(--muted)'}">${si.sc_property||'Non sélectionnée'}</div></div>
</div>
<div id="gsc-props-${id}" class="hidden" style="margin-bottom:16px"></div>

<div class="accent-title">Hébergement</div>
<div class="grid2 mb-16">
<div><label>Hébergeur</label><input id="cf-host-${id}" value="${si.host_provider||''}" placeholder="OVH, Hetzner..."></div>
<div><label>IP</label><input id="cf-hostip-${id}" value="${si.host_ip||''}" placeholder="1.2.3.4"></div>
<div><label>Localisation</label><input id="cf-vpslocale-${id}" value="${si.vps_location||''}" placeholder="FR, DE, NL..."></div>
</div>

<div class="accent-title">Profil éditorial</div>
<div class="grid2 mb-16">
<div><label>Niche</label><input id="cf-niche-${id}" value="${si.niche||''}"></div>
<div><label>Ton</label><select id="cf-tone-${id}">
<option value="conversationnel"${si.editorial_tone==='conversationnel'?' selected':''}>Conversationnel</option>
<option value="journalistique"${si.editorial_tone==='journalistique'?' selected':''}>Journalistique</option>
<option value="technique"${si.editorial_tone==='technique'?' selected':''}>Technique</option>
<option value="commercial"${si.editorial_tone==='commercial'?' selected':''}>Commercial</option>
<option value="academique"${si.editorial_tone==='academique'?' selected':''}>Académique</option>
</select></div>
<div><label>Longueur (mots)</label><input id="cf-artlen-${id}" type="number" value="${si.avg_article_length||1500}"></div>
<div><label>Instructions Claude</label><input id="cf-style-${id}" value="${si.editorial_style||''}" placeholder="Style, ton, exemples..."></div>

async function saveSiteConfig(id){
const msgEl=document.getElementById('cfg-msg-'+id);
msgEl.style.color='var(--muted)';
msgEl.textContent='Sauvegarde...';
try{
const d={};
const val=(elId)=>{const el=document.getElementById(elId);return el?el.value.trim():''};
const set=(key,elId)=>{const v=val(elId);if(v)d[key]=v;};
set('wp_admin_url','cf-wpadmin-'+id);
set('wp_username','cf-wpuser-'+id);
set('wp_seo_plugin','cf-seoplug-'+id);
set('host_provider','cf-host-'+id);
set('host_ip','cf-hostip-'+id);
set('vps_location','cf-vpslocale-'+id);
set('niche','cf-niche-'+id);
set('editorial_tone','cf-tone-'+id);
set('editorial_style','cf-style-'+id);
const artLen=val('cf-artlen-'+id);
if(artLen)d.avg_article_length=Number(artLen);
const wppass=val('cf-wppass-'+id);
if(wppass)d.wp_app_password=wppass;

const res=await apiFetch('/sites/'+id,{method:'PUT',body:JSON.stringify(d)});
msgEl.style.color='var(--success)';
msgEl.textContent='\u2713 Sauvegardé';
setTimeout(()=>{msgEl.textContent='';loadOverview();},1500);
}catch(e){
msgEl.style.color='var(--danger)';
msgEl.textContent='Erreur : '+e.message;
}
}

async function testWP(id){
const msgEl=document.getElementById('cfg-msg-'+id);
msgEl.style.color='var(--muted)';
msgEl.textContent='Test en cours...';
try{
const res=await apiFetch('/generator/test-connection/'+id,{method:'POST'});
if(res.ok){msgEl.style.color='var(--success)';msgEl.textContent='\u2713 Connexion WP OK';}
else{msgEl.style.color='var(--danger)';msgEl.textContent='\u2717 '+(res.error||'connexion impossible');}
}catch(e){msgEl.style.color='var(--danger)';msgEl.textContent='\u2717 '+e.message;}
}

async function scanSite(id){
const msgEl=document.getElementById('cfg-msg-'+id);
msgEl.style.color='var(--muted)';
msgEl.textContent='Scan SEO en cours...';
try{
const res=await apiFetch('/actions/scan/'+id,{method:'POST'});
const parts=[];
if(res.keywords_synced)parts.push(res.keywords_synced+' mots-clés');
if(res.dataforseo_enriched)parts.push(res.dataforseo_enriched+' enrichis');
if(res.optimizations)parts.push(res.optimizations+' optim.');
if(res.new_content)parts.push(res.new_content+' nouveaux contenus');
if(res.indexed_pages)parts.push(res.indexed_pages+' pages indexées');
msgEl.style.color=res.errors&&res.errors.length?'var(--warn)':'var(--success)';
msgEl.textContent='\u2713 Scan terminé'+(parts.length?' \u2014 '+parts.join(', '):'');
if(res.errors&&res.errors.length)msgEl.textContent+=' ('+res.errors.length+' erreur'+(res.errors.length>1?'s':'')+')';
setTimeout(()=>loadOverview(),2000);
}catch(e){msgEl.style.color='var(--danger)';msgEl.textContent='Erreur : '+e.message;}
}

async function loadGSCProperties(siteId){
const container=document.getElementById('gsc-props-'+siteId);
container.classList.remove('hidden');
container.innerHTML='<div style="font-size:12px;color:var(--muted)">Chargement...</div>';
try{
const res=await apiFetch('/auth/gsc/properties/'+siteId);
const props=res.properties||[];
if(!props.length){container.innerHTML='<div style="font-size:12px;color:var(--danger)">Aucune propriété trouvée</div>';return;}
let ph='<div style="display:flex;flex-wrap:wrap;gap:6px">';
props.forEach(p=>{
const isCurrent=p.site_url===res.current;
ph+=`<button class="btn2 btn-sm${isCurrent?' region-btn on':''}" onclick="event.stopPropagation();selectGSCProperty(${siteId},'${p.site_url.replace(/'/g,"\\'")}')">${p.site_url}</button>`;
});
container.innerHTML=ph+'</div>';
}catch(e){container.innerHTML=`<div style="font-size:12px;color:var(--danger)">${e.message}</div>`;}
}

async function selectGSCProperty(siteId,prop){
try{
await apiFetch('/auth/gsc/select/'+siteId,{method:'POST',body:JSON.stringify({property:prop})});
document.getElementById('cf-gsc-prop-'+siteId).textContent=prop;
document.getElementById('cf-gsc-prop-'+siteId).style.color='var(--success)';
document.getElementById('gsc-props-'+siteId).classList.add('hidden');
}catch(e){alert('Erreur : '+e.message);}
}

async function connectGSC(siteId){
try{const res=await apiFetch('/auth/gsc/connect/'+siteId);window.open(res.url,'_blank','width=600,height=700');}
catch(e){alert('Erreur GSC : '+e.message);}
}

async function deleteSite(id){
try{await apiFetch('/sites/'+id,{method:'DELETE'});loadOverview();}
catch(e){alert('Erreur : '+e.message);}
}

function confirmDeleteSite(id,name){
if(confirm('Supprimer "'+name+'" ?\nToutes les données seront perdues.')){deleteSite(id);}
}

// GENERATOR
async function loadGenerator(){
let sites;
try{sites=await apiFetch('/sites/');}catch(e){document.getElementById('tab-1').innerHTML=`<div class="card" style="color:var(--danger)">Erreur : ${e.message}</div>`;return;}
let h=`<div class="section-title mb-12">Générateur WordPress</div><div class="card">
<label>Site cible</label><select id="gen-site" style="margin-bottom:16px" onchange="showGenForm()"><option value="">Sélectionner un site...</option>`;
sites.forEach(s=>{h+=`<option value="${s.id}">${s.name} \u2014 ${s.domain}</option>`;});
h+=`</select><div id="gen-form" class="hidden">
<div class="accent-title">FTP</div>
<div class="grid2 mb-16"><div><label>Host</label><input id="g-ftp-host"></div><div><label>User</label><input id="g-ftp-user"></div><div><label>Password</label><input id="g-ftp-pass" type="password"></div><div><label>WP User</label><input id="g-wp-user" value="admin"></div></div>
<div class="accent-title">MySQL</div>
<div class="grid2 mb-16"><div><label>Host</label><input id="g-db-host" placeholder="localhost"></div><div><label>Nom BDD</label><input id="g-db-name"></div><div><label>User</label><input id="g-db-user"></div><div><label>Password</label><input id="g-db-pass" type="password"></div></div>
<button class="btn" onclick="installWP()">Installer WordPress</button>
</div></div><div id="gen-logs"></div>`;
document.getElementById('tab-1').innerHTML=h;
}

function showGenForm(){document.getElementById('gen-form').classList.toggle('hidden',!document.getElementById('gen-site').value);}

async function installWP(){
const sid=document.getElementById('gen-site').value;
if(!sid)return;
const cfg={ftp_host:document.getElementById('g-ftp-host').value,ftp_user:document.getElementById('g-ftp-user').value,ftp_password:document.getElementById('g-ftp-pass').value,wp_username:document.getElementById('g-wp-user').value,db_host:document.getElementById('g-db-host').value,db_name:document.getElementById('g-db-name').value,db_user:document.getElementById('g-db-user').value,db_password:document.getElementById('g-db-pass').value};
try{await apiFetch(`/sites/${sid}`,{method:'PUT',body:JSON.stringify(cfg)});}
catch(e){alert('Erreur config : '+e.message);return;}
try{await apiFetch('/generator/install',{method:'POST',body:JSON.stringify({site_id:Number(sid)})});}
catch(e){alert('Erreur install : '+e.message);return;}
const poll=setInterval(async()=>{
try{
const d=await apiFetch(`/generator/logs/${sid}`);
let lh='<div class="card log-box">';
(d.logs||[]).forEach(l=>{const cls=l.startsWith('ERROR')?'log-err':l.startsWith('SUCCESS')?'log-win':'log-ok';lh+=`<div class="${cls}">${l}</div>`;});
document.getElementById('gen-logs').innerHTML=lh+'</div>';
if(d.logs?.some(l=>l.startsWith('SUCCESS')||l.startsWith('ERROR')))clearInterval(poll);
}catch(e){clearInterval(poll);document.getElementById('gen-logs').innerHTML=`<div class="card log-box"><div class="log-err">${e.message}</div></div>`;}
},2000);
}

// GEOLOC
let geoRegions=[],geoDepts=[],selRegs=[],selDepts=[],geoPreview=null;

async function loadGeoloc(){
let sites,regions;
try{[sites,regions]=await Promise.all([apiFetch('/sites/'),apiFetch('/geoloc/regions')]);}catch(e){document.getElementById('tab-2').innerHTML=`<div class="card" style="color:var(--danger)">Erreur : ${e.message}</div>`;return;}
geoRegions=regions;selRegs=[];selDepts=[];geoPreview=null;
let h=`<div class="section-title mb-12">Pages géolocalisées</div><div class="card">
<div class="grid2 mb-16">
<div><label>Site cible</label><select id="geo-site"><option value="">Sélectionner...</option>`;
sites.forEach(s=>{h+=`<option value="${s.id}">${s.name}</option>`;});
h+=`</select></div>
<div><label>Mot-clé (avec {ville})</label><input id="geo-kw" placeholder="serrurier {ville}"></div></div>
<div class="mb-16"><label>Population min : <span id="pop-val">5 000</span> hab.</label>
<input type="range" id="geo-pop" min="1000" max="50000" step="1000" value="5000" oninput="document.getElementById('pop-val').textContent=Number(this.value).toLocaleString('fr-FR')" style="accent-color:var(--accent)"></div>
<div class="mb-16"><label>Régions</label><div class="wrap-btns" id="geo-regions">`;
regions.forEach(r=>{h+=`<button class="btn2 region-btn" style="font-size:10px;padding:4px 10px" onclick="toggleRegion('${r.replace(/'/g,"\\'")}',this)">${r}</button>`;});
h+=`</div></div><div class="mb-16 hidden" id="geo-depts-wrap"><label>Départements</label><div class="wrap-btns-sm" id="geo-depts"></div></div>
<div class="flex-gap-10"><button class="btn" onclick="previewGeoloc()">Prévisualiser</button><span id="geo-gen-btn"></span></div>
</div><div id="geo-result"></div><div id="geo-preview"></div>`;
document.getElementById('tab-2').innerHTML=h;
}

async function toggleRegion(r,el){
if(selRegs.includes(r)){selRegs=selRegs.filter(x=>x!==r);el.classList.remove('on');}
else{selRegs.push(r);el.classList.add('on');}
if(selRegs.length){
const all=[];for(const rr of selRegs){const d=await apiFetch(`/geoloc/departments?region=${encodeURIComponent(rr)}`);all.push(...d);}
geoDepts=[...new Set(all)].sort();
}else{geoDepts=await apiFetch('/geoloc/departments');}
selDepts=[];
const wrap=document.getElementById('geo-depts-wrap');
const cont=document.getElementById('geo-depts');
if(geoDepts.length){wrap.classList.remove('hidden');cont.innerHTML=geoDepts.map(d=>`<button class="btn2 region-btn" style="font-size:10px;padding:3px 8px;min-width:36px" onclick="toggleDept('${d}',this)">${d}</button>`).join('');}
else wrap.classList.add('hidden');
}

function toggleDept(d,el){
if(selDepts.includes(d)){selDepts=selDepts.filter(x=>x!==d);el.classList.remove('on');}
else{selDepts.push(d);el.classList.add('on');}
}

function geoBody(){
return{site_id:Number(document.getElementById('geo-site').value),keyword_template:document.getElementById('geo-kw').value,min_population:Number(document.getElementById('geo-pop').value),...(selRegs.length>0&&{regions:selRegs}),...(selDepts.length>0&&{departments:selDepts})};
}

async function previewGeoloc(){
if(!document.getElementById('geo-site').value||!document.getElementById('geo-kw').value)return;
document.getElementById('geo-preview').innerHTML='';document.getElementById('geo-gen-btn').innerHTML='';
try{geoPreview=await apiFetch('/geoloc/preview',{method:'POST',body:JSON.stringify(geoBody())});}
catch(e){document.getElementById('geo-preview').innerHTML=`<div class="card" style="color:var(--danger)">${e.message}</div>`;return;}
document.getElementById('geo-gen-btn').innerHTML=`<button class="btn" style="background:var(--success)" onclick="generateGeoloc()">Générer ${geoPreview.total_pages} pages (~${geoPreview.estimated_cost_eur}\u20AC)</button>`;
let h=`<div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:8px">${geoPreview.total_pages} pages \u2014 ~${geoPreview.estimated_cost_eur}\u20AC</div><div style="max-height:260px;overflow-y:auto">`;
geoPreview.pages.forEach(p=>{h+=`<div class="preview-row"><span>${p.keyword}</span><span class="preview-meta">${p.city} (${p.department}) \u2014 ${fmt(p.population)} hab.</span></div>`;});
if(geoPreview.total_pages>20)h+=`<div style="padding:8px;font-size:11px;color:var(--muted);text-align:center">... et ${geoPreview.total_pages-20} autres</div>`;
h+=`</div></div>`;
document.getElementById('geo-preview').innerHTML=h;
}

async function generateGeoloc(){
try{const res=await apiFetch('/geoloc/generate',{method:'POST',body:JSON.stringify(geoBody())});
document.getElementById('geo-result').innerHTML=`<div class="card result-box"><div class="result-msg">${res.message}</div><div class="result-sub">Visible dans la file de validation (Overview)</div></div>`;
}catch(e){document.getElementById('geo-result').innerHTML=`<div class="card" style="color:var(--danger)">${e.message}</div>`;}
}
