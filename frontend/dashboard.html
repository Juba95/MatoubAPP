<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatoubeAPP</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:#ffffff;--card2:#f0f0f5;--border:#e2e2ea;--accent:#6c5ce7;--accent2:#a29bfe;--text:#1a1a2e;--muted:#8888a0;--danger:#ff6b6b;--success:#51cf66;--warn:#fcc419;--orange:#ff922b;--blue:#339af0;--mono:'JetBrains Mono',monospace;--body:'Inter',system-ui,sans-serif;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:1080px;margin:0 auto;padding:24px 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:12px;transition:border-color .2s}
input,select,textarea{width:100%;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--body);outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{padding:10px 22px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--body);transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn2{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--body);transition:all .15s}
.btn2:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{font-size:11px;padding:5px 12px;border-radius:6px}
.btn-success{background:var(--success);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--body);font-size:11px;padding:5px 14px;font-weight:600}
.btn-danger{border-color:var(--danger);color:var(--danger)}
label{font-size:11px;color:var(--muted);margin-bottom:5px;display:block;letter-spacing:.3px;text-transform:uppercase;font-weight:500}
.pill{font-size:10px;padding:3px 10px;border-radius:99px;font-weight:600;display:inline-block;letter-spacing:.3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.metric-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.metric-val{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-1px}
.metric-sub{font-size:11px;margin-top:4px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:10px;letter-spacing:1px;text-transform:uppercase}
.tabs{display:flex;gap:0;margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;overflow:hidden}
.tab{flex:1;padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;border-radius:8px;cursor:pointer;font-family:var(--body);transition:all .2s;text-align:center}
.tab.active{color:#ffffff;background:var(--accent)}
.tab:hover:not(.active){color:var(--text);background:var(--card2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site-row{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;transition:all .2s}
.site-row:hover{border-color:var(--accent)!important;background:var(--card2)}
.site-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.site-stats{display:flex;gap:18px;font-size:11px;color:var(--muted);flex-shrink:0}
.site-stats b{font-weight:600;color:var(--text)}
.action-row{display:flex;align-items:flex-start;gap:14px;transition:all .2s}
.action-row:hover{border-color:var(--accent)!important}
.action-score{font-size:15px;font-weight:700;color:var(--accent);flex-shrink:0;font-family:var(--mono);min-width:50px;text-align:right}
.log-box{background:#f5f5f7;font-family:var(--mono);font-size:12px;max-height:300px;overflow-y:auto;padding:14px;border-radius:8px;border:1px solid var(--border)}
.log-ok{color:#2d7a3a}.log-err{color:var(--danger)}.log-win{color:var(--success)}
.region-btn{transition:all .15s}.region-btn.on{background:rgba(108,92,231,.15);border-color:var(--accent);color:var(--accent)}
.up{color:var(--success);font-size:11px;font-weight:600}.down{color:var(--danger);font-size:11px;font-weight:600}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#e8e8f0 0%,var(--bg) 70%)}
.login-box{width:380px;padding:40px;border:1px solid var(--border)}
.login-title{font-size:32px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:28px;letter-spacing:1px;text-transform:uppercase}
.error{color:var(--danger);font-size:12px;margin-bottom:12px}
.hidden{display:none}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px}
.mt-24{margin-top:28px}
.mb-10{margin-bottom:10px}
.mb-12{margin-bottom:12px}
.mb-16{margin-bottom:16px}
.text-center{text-align:center}
.flex-gap-6{display:flex;gap:6px;margin-top:8px}
.flex-gap-8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flex-gap-10{display:flex;gap:10px}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.preview-row:last-child{border-bottom:none}
.preview-meta{color:var(--muted);font-size:11px}
.wrap-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wrap-btns-sm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.accent-title{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.result-box{border-color:var(--success)}
.result-msg{color:var(--success);font-weight:600}
.result-sub{font-size:12px;color:var(--muted)}
.cfg-panel{background:var(--card2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:24px;margin-top:-12px;margin-bottom:12px}
.cfg-icon{font-size:16px;color:var(--muted);margin-left:8px;flex-shrink:0;transition:all .2s}
.site-row:hover .cfg-icon{color:var(--accent)}
.dist-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:10px}
.dist-bar>div{border-radius:3px;transition:width .3s}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
<div class="card login-box">
<div class="login-title">MatoubeAPP</div>
<div class="login-sub">SEO Automation</div>
<label>Email</label>
<input id="login-email" placeholder="admin@matoube.app" style="margin-bottom:12px">
<label>Mot de passe</label>
<input id="login-pass" type="password" style="margin-bottom:20px">
<div id="login-err" class="error hidden"></div>
<button class="btn" style="width:100%" onclick="doLogin()">Se connecter</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="container">
<header>
<div style="display:flex;align-items:center">
<span class="logo">MatoubeAPP</span>
<span class="logo-sub">SEO Automation</span>
</div>
<button class="btn2 btn-sm" onclick="localStorage.removeItem('pbn_token');location.reload()">Déconnexion</button>
</header>
<div class="tabs">
<button class="tab active" onclick="switchTab(0,this)">Overview</button>
<button class="tab" onclick="switchTab(1,this)">Analyse IA / GEO</button>
<button class="tab" onclick="switchTab(2,this)">Générateur WP</button>
<button class="tab" onclick="switchTab(3,this)">Pages Géoloc</button>
<button class="tab" onclick="switchTab(4,this)">Paramètres</button>
</div>
<div id="tab-0"></div>
<div id="tab-1" class="hidden"></div>
<div id="tab-2" class="hidden"></div>
<div id="tab-3" class="hidden"></div>
<div id="tab-4" class="hidden"></div>
</div>
</div>

<script>
const API='';
let TOKEN=localStorage.getItem('pbn_token');
let _openCfg=null;

async function apiFetch(path,opts={}){
const h={'Content-Type':'application/json'};
if(TOKEN)h['Authorization']='Bearer '+TOKEN;
console.log(`[API] ${opts.method||'GET'} ${API+path}`,opts.body||'');
let r;
try{r=await fetch(API+path,{...opts,headers:h});}
catch(e){console.error('[API] Network error:',e);throw new Error('Réseau indisponible');}
console.log(`[API] Response: ${r.status} ${r.statusText}`);
if(r.status===401){localStorage.removeItem('pbn_token');location.reload();return;}
if(!r.ok&&r.status!==401){const txt=await r.text().catch(()=>'');console.error('[API] Error body:',txt);let msg;try{msg=JSON.parse(txt).detail||txt;}catch{msg=txt||r.statusText;}throw new Error(msg);}
return r.json();
}
const fmt=n=>n!=null?Number(n).toLocaleString('fr-FR'):'\u2014';
const deltaHtml=v=>{if(!v||v===0)return'';const p=v>0;return `<span class="${p?'up':'down'}">${p?'+':''}${Number(v).toFixed(1)}</span>`;};
const pillHtml=(text,color)=>`<span class="pill" style="background:${color}20;color:${color}">${text}</span>`;

// LOGIN
async function doLogin(){
const email=document.getElementById('login-email').value;
const pass=document.getElementById('login-pass').value;
const errEl=document.getElementById('login-err');
errEl.classList.add('hidden');
console.log('[LOGIN] Tentative avec email:',email);
try{
const d=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({email,password:pass})});
console.log('[LOGIN] Réponse:',d);
if(d.access_token){TOKEN=d.access_token;localStorage.setItem('pbn_token',TOKEN);console.log('[LOGIN] OK — token stocké');showDashboard();}
else{console.warn('[LOGIN] Pas de token dans la réponse');errEl.textContent='Identifiants invalides';errEl.classList.remove('hidden');}
}catch(e){console.error('[LOGIN] Erreur:',e.message);errEl.textContent=e.message||'Erreur de connexion';errEl.classList.remove('hidden');}
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function showDashboard(){
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
loadOverview();
}

function switchTab(n,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
for(let i=0;i<5;i++)document.getElementById('tab-'+i).classList.toggle('hidden',i!==n);
if(n===0)loadOverview();
if(n===1)loadGEO();
if(n===2)loadGenerator();
if(n===3)loadGeoloc();
if(n===4)loadSettings();
}

// OVERVIEW
async function loadOverview(){
_openCfg=null;
let sites,actions;
try{[sites,actions]=await Promise.all([apiFetch('/sites/'),apiFetch('/actions/')]);}
catch(e){document.getElementById('tab-0').innerHTML=`<div class="card" style="color:var(--danger)">Erreur chargement : ${e.message}</div>`;return;}

let h='';

// Bouton ajouter
h+=`<div class="flex-between mb-12"><div class="section-title" style="margin-bottom:0">Mes sites</div><button class="btn2 btn-sm" onclick="toggleAddSite()">+ Ajouter un site</button></div>`;
h+=`<div id="add-site-form" class="hidden" style="margin-bottom:16px"><div class="card grid2" style="gap:10px">
<div><label>Nom</label><input id="ns-name" placeholder="Mon site"></div>
<div><label>Domaine</label><input id="ns-domain" placeholder="monsite.fr"></div>
<div><label>Niche</label><input id="ns-niche" placeholder="plomberie, épaviste..."></div>
<div><label>Hébergeur</label><input id="ns-host" placeholder="OVH, Hetzner..."></div>
<div><label>Ton éditorial</label><select id="ns-tone"><option value="conversationnel">Conversationnel</option><option value="journalistique">Journalistique</option><option value="technique">Technique</option><option value="commercial">Commercial</option><option value="academique">Académique</option></select></div>
<div style="display:flex;align-items:flex-end"><button class="btn" onclick="addSite()">Créer</button></div>
</div></div>`;

if(sites.length===0){
h+=`<div class="card text-center" style="color:var(--muted);padding:32px">Aucun site \u2014 ajoute ton premier site</div>`;
} else {
// UN BLOC PAR SITE
sites.forEach(si=>{
const dd=si.distribution||{};
const hasData=si.total_keywords>0;
const deltaCol=si.position_delta>0?'var(--success)':si.position_delta<-3?'var(--danger)':'var(--muted)';

h+=`<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">`;

// Header du site (cliquable pour config)
h+=`<div class="site-row" id="site-row-${si.id}" onclick="toggleSiteConfig(${si.id})" style="padding:16px 22px;border-bottom:1px solid var(--border);border-radius:0">
<div class="site-dot" style="background:${si.sc_connected?'var(--success)':'var(--muted)'}"></div>
<div style="flex:1;min-width:0">
<div style="font-size:15px;font-weight:700">${si.name}${si.sc_connected?'':' <span style="font-size:9px;padding:2px 6px;background:var(--card2);border-radius:4px;color:var(--muted);font-weight:500">GSC non connecté</span>'}</div>
<div style="font-size:11px;color:var(--muted);margin-top:2px">${si.domain} \u2022 ${si.host_provider||'non config.'}</div>
</div>
<span class="cfg-icon" id="cfg-icon-${si.id}">\u2699\uFE0F</span>
<span style="font-size:14px;color:var(--muted);margin-left:2px;cursor:pointer;opacity:.4" title="Supprimer" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.4" onclick="event.stopPropagation();confirmDeleteSite(${si.id},'${si.name.replace(/'/g,"\\'")}')">&#x1F5D1;</span>
</div>`;

// Config panel (hidden)
h+=`<div id="site-cfg-${si.id}" class="hidden"></div>`;

// Métriques du site
const aiScore=si.ai_score;
const aiCol=aiScore!=null?(aiScore>=70?'var(--success)':aiScore>=40?'var(--warn)':'var(--danger)'):'var(--muted)';
h+=`<div style="display:grid;grid-template-columns:repeat(6,1fr);text-align:center;border-bottom:1px solid var(--border)">
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Note IA</div><div style="font-size:20px;font-weight:700;font-family:var(--mono);color:${aiCol}">${aiScore!=null?aiScore:'\u2014'}</div><div style="font-size:9px;color:var(--muted)">${aiScore!=null?'/100':'non analysé'}</div></div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Pages indexées</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${fmt(si.indexed_pages||0)}</div></div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Mots-clés</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${fmt(si.total_keywords||0)}</div></div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Pos. moy.</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${si.avg_position||'\u2014'}</div>${si.position_delta?`<div style="font-size:11px;color:${deltaCol};font-weight:600">${si.position_delta>0?'+':''}${si.position_delta}</div>`:''}</div>
<div style="padding:14px 8px;border-right:1px solid var(--border)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Actions</div><div style="font-size:20px;font-weight:700;font-family:var(--mono)">${si.pending_actions}</div></div>
<div style="padding:14px 8px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px">Distribution</div><div style="font-size:12px;font-family:var(--mono)"><span style="color:var(--success)">${dd.top_3||0}</span> <span style="color:var(--blue)">${dd.top_4_10||0}</span> <span style="color:var(--warn)">${dd.top_11_20||0}</span></div><div style="font-size:9px;color:var(--muted);margin-top:2px">top3 \u00B7 4-10 \u00B7 11-20</div></div>
</div>`;

// Opportunités + Drops côte à côte
if(hasData){
const opps=si.top_opportunities||[];
const drops=si.top_drops||[];
h+=`<div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:${(opps.length||drops.length)?'1px solid var(--border)':'none'}">`;

// Opportunités
h+=`<div style="padding:14px 18px;border-right:1px solid var(--border)">
<div style="font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:600;letter-spacing:.3px;margin-bottom:8px">Opportunités</div>`;
if(opps.length){opps.forEach(o=>{
h+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span>${o.keyword}</span><span style="color:var(--warn);font-weight:600;font-family:var(--mono)">pos.${Math.round(o.position)}</span></div>`;
});}else{h+=`<div style="font-size:11px;color:var(--muted)">Aucune</div>`;}
h+=`</div>`;

// Drops
h+=`<div style="padding:14px 18px">
<div style="font-size:10px;color:var(--danger);text-transform:uppercase;font-weight:600;letter-spacing:.3px;margin-bottom:8px">Baisses</div>`;
if(drops.length){drops.forEach(d=>{
h+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span>${d.keyword}</span><span style="color:var(--danger);font-weight:600;font-family:var(--mono)">${Math.round(d.from)}\u2192${Math.round(d.to)}</span></div>`;
});}else{h+=`<div style="font-size:11px;color:var(--muted)">Aucune</div>`;}
h+=`</div></div>`;
}

h+=`</div>`; // fin card site
});
}

// Actions — groupées par site
h+=`<div class="flex-between mt-24 mb-10"><div class="section-title">File de validation <span style="font-size:12px;color:var(--muted);font-weight:400">(${actions.length})</span></div>`;
if(actions.length>0)h+=`<button class="btn2 btn-sm" onclick="validateAll([${actions.map(a=>a.id).join(',')}])">Tout valider</button>`;
h+=`</div>`;

if(actions.length===0){h+=`<div class="card text-center" style="color:var(--muted);padding:24px">Aucune action en attente \u2014 lance un scan SEO</div>`;}
else{
// Grouper par site
const bySite={};
actions.forEach(a=>{
const key=a.site_id||0;
if(!bySite[key])bySite[key]={name:a.site_name||'Site inconnu',actions:[]};
bySite[key].actions.push(a);
});

Object.values(bySite).forEach(group=>{
const siteActions=group.actions;
const siteIds=siteActions.map(a=>a.id);
h+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">`;
// Header du groupe
h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--card2)">
<div style="font-size:13px;font-weight:700">${group.name} <span style="font-size:11px;color:var(--muted);font-weight:400">(${siteActions.length} actions)</span></div>
<div style="display:flex;gap:6px">
<button class="btn2 btn-sm" onclick="rejectBatch([${siteIds.join(',')}])">Tout rejeter</button>
<button class="btn-success" style="font-size:11px;padding:4px 14px" onclick="validateAll([${siteIds.join(',')}])">Tout valider</button>
</div></div>`;

// Séparer par type : Optim/Create d'abord, Géoloc ensuite
const optimActions=siteActions.filter(a=>a.action_type!=='geoloc');
const geolocActions=siteActions.filter(a=>a.action_type==='geoloc');
const sortedActions=[...optimActions,...geolocActions];
if(optimActions.length&&geolocActions.length){
// Sous-header pour la section Optim/Create
h+=`<div style="padding:6px 20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--blue);background:rgba(113,128,255,.05);border-bottom:1px solid var(--border)">Optimisations / Nouveaux contenus (${optimActions.length})</div>`;
}

// Actions du site
let geolocHeaderShown=false;
sortedActions.forEach((a,idx)=>{
if(!geolocHeaderShown&&a.action_type==='geoloc'&&optimActions.length){
geolocHeaderShown=true;
h+=`<div style="padding:6px 20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--success);background:rgba(81,207,102,.05);border-bottom:1px solid var(--border)">Pages géolocalisées (${geolocActions.length})</div>`;
}
const typeLabel=a.action_type==='optimize'?'Optim.':a.action_type==='geoloc'?'Géoloc':'Nouveau';
const typeColor=a.action_type==='optimize'?'var(--blue)':a.action_type==='create'?'var(--accent)':'var(--success)';
const posInfo=a.current_position&&a.previous_position?`${Math.round(a.previous_position)}\u2192${Math.round(a.current_position)}`:'';
const isFailed=a.status==='failed';
const isRunning=a.status==='executing'||a.status==='validated';
const statusPill=isFailed?pillHtml('ÉCHEC','var(--danger)'):isRunning?pillHtml('EN COURS','var(--orange)'):'';
const rowBg=isFailed?'background:#fff0f0':isRunning?'background:#fff8f0':'';

h+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);${rowBg}">
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
<span style="font-size:13px;font-weight:600">${a.keyword||a.title}</span>${statusPill}
</div>
<div style="font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(a.description||'').split('\\nERREUR:')[0]}</div>
${isFailed&&a.description&&a.description.includes('ERREUR:')?`<div style="font-size:10px;color:var(--danger);margin-top:4px;font-family:var(--mono)">${a.description.split('ERREUR:').pop().substring(0,100)}</div>`:''}
</div>
<div class="flex-gap-8" style="flex-shrink:0">${pillHtml(typeLabel,typeColor)}${a.search_volume>0?`<span style="font-size:10px;color:var(--muted)">vol.${fmt(a.search_volume)}</span>`:''}${posInfo?`<span class="down" style="font-size:10px">${posInfo}</span>`:''}</div>
<div style="font-size:14px;font-weight:700;color:var(--accent);font-family:var(--mono);min-width:40px;text-align:right">${fmt(Math.round(a.impact_score))}</div>
<div style="display:flex;gap:4px;flex-shrink:0">
<button class="btn2 btn-sm" onclick="rejectAction(${a.id})" style="padding:3px 8px">Rej.</button>
${isFailed?`<button class="btn-success" style="padding:3px 10px" onclick="retryAction(${a.id})">Retry</button>`:`<button class="btn-success" style="padding:3px 10px" onclick="validateAction(${a.id})">${isRunning?'...':'Valid.'}</button>`}
${(isRunning||isFailed)?`<button class="btn2 btn-sm" onclick="showActionLogs(${a.id})" style="padding:3px 8px">Logs</button>`:''}
</div>
</div><div id="action-logs-${a.id}"></div>`;
});
h+=`</div>`;
});
}

document.getElementById('tab-0').innerHTML=h;
}

}

async function runFullInstall(){
const domain=document.getElementById('g-domain').value.trim();
if(!domain){alert('Domaine requis');return;}

const genMode=document.querySelector('input[name="g-gen-mode"]:checked').value;
const compUrls=[];
if(genMode==='concurrent'){
['g-comp-url1','g-comp-url2','g-comp-url3'].forEach(id=>{
const v=document.getElementById(id).value.trim();
if(v)compUrls.push(v);
});
}

let bizHours={};
try{
const hv=document.getElementById('g-biz-hours').value.trim();
if(hv)bizHours=JSON.parse(hv);
}catch(e){/* ignore parse errors, send empty */}

const payload={
domain:domain,
site_title:document.getElementById('g-title').value.trim()||domain,
admin_user:document.getElementById('g-admin-user').value.trim()||'admin',
admin_email:document.getElementById('g-admin-email').value.trim(),
admin_pass:document.getElementById('g-admin-pass').value,
ftp_host:document.getElementById('g-ftp-host').value.trim(),
ftp_user:document.getElementById('g-ftp-user').value.trim(),
ftp_pass:document.getElementById('g-ftp-pass').value,
ftp_root:document.getElementById('g-ftp-root').value.trim()||'/public_html',
db_host:document.getElementById('g-db-host').value.trim()||'localhost',
db_name:document.getElementById('g-db-name').value.trim(),
db_user:document.getElementById('g-db-user').value.trim(),
db_pass:document.getElementById('g-db-pass').value,
db_prefix:document.getElementById('g-db-prefix').value.trim()||'wp_',
reset_first:document.getElementById('g-reset').checked,
use_divi:document.getElementById('g-use-divi').checked,
et_username:document.getElementById('g-et-user').value.trim(),
et_api_key:document.getElementById('g-et-key').value.trim(),
generation_mode:genMode,
site_prompt:document.getElementById('g-site-prompt').value.trim(),
competitor_urls:compUrls,
use_webarchive:document.getElementById('g-webarchive').checked,
eat_enabled:document.getElementById('g-eat-enabled').checked,
business_name:document.getElementById('g-biz-name').value.trim(),
business_address:document.getElementById('g-biz-address').value.trim(),
business_phone:document.getElementById('g-biz-phone').value.trim(),
business_email:document.getElementById('g-biz-email').value.trim(),
business_lat:document.getElementById('g-biz-lat').value.trim(),
business_lng:document.getElementById('g-biz-lng').value.trim(),
business_hours:bizHours,
eat_faq:document.getElementById('g-eat-faq').checked,
eat_reviews:document.getElementById('g-eat-reviews').checked,
eat_hours:document.getElementById('g-eat-hours').checked,
eat_map:document.getElementById('g-eat-map').checked,
eat_reassurance:document.getElementById('g-eat-reassurance').checked,
eat_how_it_works:document.getElementById('g-eat-howit').checked,
};

const btn=document.getElementById('gen-install-btn');
btn.disabled=true;btn.textContent='Installation en cours...';
document.getElementById('gen-status').innerHTML='<span style="color:var(--accent);font-size:13px;font-weight:600">Demarrage du pipeline...</span>';

let key;
try{
const res=await apiFetch('/generator/full-install',{method:'POST',body:JSON.stringify(payload)});
key=res.key;
}catch(e){
btn.disabled=false;btn.textContent='Installer WordPress';
document.getElementById('gen-status').innerHTML=`<span style="color:var(--danger);font-size:13px">Erreur: ${e.message}</span>`;
return;
}

if(_genPollInterval)clearInterval(_genPollInterval);

const stepLabels={init:'Initialisation',ftp_upload:'Upload FTP',database:'Base de donnees',wp_install:'Installation WP',theme:'Installation theme',content:'Generation contenu',eat:'Blocs E-A-T',done:'Termine'};

_genPollInterval=setInterval(async()=>{
try{
const d=await apiFetch(`/generator/pipeline-status/${key}`);
const stepLabel=stepLabels[d.step]||d.step;
const statusColor=d.done?(d.error?'var(--danger)':'var(--success)'):'var(--accent)';
document.getElementById('gen-status').innerHTML=`<span style="color:${statusColor};font-size:13px;font-weight:600">Etape : ${stepLabel}</span>`;
let lh='<div class="card log-box">';
(d.logs||[]).forEach(l=>{
const cls=l.startsWith('ERROR')?'log-err':l.startsWith('SUCCESS')?'log-win':'log-ok';
lh+=`<div class="${cls}">${l}</div>`;
});
lh+='</div>';
document.getElementById('gen-logs').innerHTML=lh;
const logBox=document.querySelector('#gen-logs .log-box');
if(logBox)logBox.scrollTop=logBox.scrollHeight;
if(d.done){
clearInterval(_genPollInterval);_genPollInterval=null;
btn.disabled=false;btn.textContent='Installer WordPress';
}
}catch(e){
clearInterval(_genPollInterval);_genPollInterval=null;
btn.disabled=false;btn.textContent='Installer WordPress';
document.getElementById('gen-logs').innerHTML=`<div class="card log-box"><div class="log-err">${e.message}</div></div>`;
}
},2000);
}

<div><label>Image \u00e0 la une (URL)</label><input id="geo-thumbnail" placeholder="https://..."></div>
<div><label>Statut</label><select id="geo-post-status"><option value="draft">Brouillon (draft)</option><option value="publish">Publié (publish)</option></select></div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;margin-top:4px">
<label ${chkLabel}><input type="checkbox" id="geo-divi"> Format Divi Builder</label>
<label ${chkLabel}><input type="checkbox" id="geo-ai-content"> G\u00e9n\u00e9rer contenu IA (Claude)</label>
<label ${chkLabel}><input type="checkbox" id="geo-concurrence"> Analyse concurrentielle</label>
</div>
<div class="grid2 mb-16">
<div><label>Nombre de variantes</label><input type="number" id="geo-variantes" min="1" max="5" value="1"></div>
<div></div>
</div>
<div style="margin-top:4px">
<div ${stepHead} onclick="geoToggleStep('geo-colors-body',this)" style="padding:10px 16px;background:var(--card2);border-radius:8px;margin-bottom:0">
<div style="display:flex;align-items:center"><span style="font-size:12px;font-weight:600;color:var(--accent)">COULEURS (optionnel)</span></div>
<span class="geo-chevron" ${chevron}>\u25BC</span>
</div>
<div id="geo-colors-body" class="hidden" style="background:var(--card2);padding:14px 16px;border-radius:0 0 8px 8px;border-top:1px solid var(--border)">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div><label>Primaire</label><input type="color" id="geo-color-primary" value="#6c5ce7" style="height:36px;padding:2px;cursor:pointer"></div>
<div><label>Secondaire</label><input type="color" id="geo-color-secondary" value="#a29bfe" style="height:36px;padding:2px;cursor:pointer"></div>
<div><label>Light</label><input type="color" id="geo-color-light" value="#f5f5f7" style="height:36px;padding:2px;cursor:pointer"></div>
<div><label>Neutre</label><input type="color" id="geo-color-neutre" value="#1a1a2e" style="height:36px;padding:2px;cursor:pointer"></div>
<div><label>CTA</label><input type="color" id="geo-color-cta" value="#51cf66" style="height:36px;padding:2px;cursor:pointer"></div>
</div>
</div>
</div>
</div></div>`;

// --- STEP 4: Actions ---
h+=`<div ${stepStyle}>
<div ${stepHead} onclick="geoToggleStep('geo-step4-body',this)">
<div style="display:flex;align-items:center"><span ${stepNum}>4</span><span ${stepTitle}>Actions</span></div>
<span class="geo-chevron" ${chevron}>\u25BC</span>
</div>
<div id="geo-step4-body" ${stepBody}>
<div class="flex-gap-10" style="margin-bottom:14px">
<button class="btn" onclick="previewGeoloc()">Pr\u00e9visualiser</button>
<button class="btn" style="background:var(--success)" onclick="generateFile()">G\u00e9n\u00e9rer fichier Excel</button>
<span id="geo-gen-btn"></span>
</div>
<div id="geo-progress-wrap" class="hidden" style="margin-bottom:12px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<span style="font-size:12px;font-weight:600;color:var(--text)" id="geo-progress-label">G\u00e9n\u00e9ration en cours...</span>
<span style="font-size:12px;font-weight:600;color:var(--accent);font-family:var(--mono)" id="geo-progress-count">0/0</span>
</div>
<div style="width:100%;height:8px;background:var(--card2);border-radius:4px;overflow:hidden">
<div id="geo-progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s ease"></div>
</div>
</div>
<div id="geo-file-status"></div>
<div id="geo-result"></div>
</div></div>`;

// --- STEP 5: Prévisualisation ---
h+=`<div ${stepStyle}>
<div ${stepHead} onclick="geoToggleStep('geo-step5-body',this)">
<div style="display:flex;align-items:center"><span ${stepNum}>5</span><span ${stepTitle}>Pr\u00e9visualisation</span></div>
<span class="geo-chevron" ${chevron}>\u25BC</span>
</div>
<div id="geo-step5-body" ${stepBody}>
<div id="geo-preview" style="color:var(--muted);font-size:13px">Cliquez sur "Pr\u00e9visualiser" pour voir les villes et le co\u00fbt estim\u00e9.</div>
</div></div>`;

document.getElementById('tab-3').innerHTML=h;
}

function geoToggleStep(id,headerEl){
const body=document.getElementById(id);
if(!body)return;
const chevEl=headerEl.querySelector('.geo-chevron');
if(body.classList.contains('hidden')){
body.classList.remove('hidden');
body.style.display='';
if(chevEl)chevEl.style.transform='rotate(0deg)';
}else{
body.classList.add('hidden');
body.style.display='none';
if(chevEl)chevEl.style.transform='rotate(-90deg)';
}
}

async function toggleRegion(r,el){
if(selRegs.includes(r)){selRegs=selRegs.filter(x=>x!==r);el.classList.remove('on');}
else{selRegs.push(r);el.classList.add('on');}
if(selRegs.length){
const all=[];for(const rr of selRegs){const d=await apiFetch(`/geoloc/departments?region=${encodeURIComponent(rr)}`);all.push(...d);}
geoDepts=[...new Set(all)].sort();
}else{geoDepts=await apiFetch('/geoloc/departments');}
selDepts=[];
const wrap=document.getElementById('geo-depts-wrap');
const cont=document.getElementById('geo-depts');
if(geoDepts.length){wrap.classList.remove('hidden');cont.innerHTML=geoDepts.map(d=>`<button class="btn2 region-btn" style="font-size:10px;padding:3px 8px;min-width:36px" onclick="toggleDept('${d}',this)">${d}</button>`).join('');}
else wrap.classList.add('hidden');
}

function toggleDept(d,el){
if(selDepts.includes(d)){selDepts=selDepts.filter(x=>x!==d);el.classList.remove('on');}
else{selDepts.push(d);el.classList.add('on');}
}

let _geoSiteId=null;
let _geoDomainCached='';
async function ensureGeoSite(){
const domain=document.getElementById('geo-domain').value.trim();
if(!domain)return null;
// Reset si le domaine a changé
if(domain!==_geoDomainCached){_geoSiteId=null;_geoDomainCached=domain;}
if(_geoSiteId)return _geoSiteId;
// Chercher d'abord dans les sites existants
try{
const sites=await apiFetch('/sites/');
const clean=domain.replace('www.','').replace('https://','').replace('http://','').replace(/\/$/,'');
const found=sites.find(s=>{const d=s.domain.replace('www.','').replace('https://','').replace('http://','').replace(/\/$/,'');return d===clean;});
if(found){_geoSiteId=found.id;return _geoSiteId;}
}catch(e){}
// Pas trouvé → créer
try{
const res=await apiFetch('/sites/',{method:'POST',body:JSON.stringify({name:domain,domain:domain})});
_geoSiteId=res.id;
}catch(e){}
return _geoSiteId;
}

function geoBody(siteId){
return{site_id:siteId,keyword_template:document.getElementById('geo-kw').value,min_population:Number(document.getElementById('geo-pop').value),...(selRegs.length>0&&{regions:selRegs}),...(selDepts.length>0&&{departments:selDepts})};
}

function geoBuildFullBody(){
const domain=document.getElementById('geo-domain').value.trim();
const kw=document.getElementById('geo-kw').value.trim();
const body={
keyword_template:kw,
site_name:document.getElementById('geo-sitename').value||domain,
site_domain:domain,
post_author:document.getElementById('geo-author').value||'admin',
post_category:document.getElementById('geo-category').value||'',
post_status:document.getElementById('geo-post-status').value||'draft',
post_thumbnail:document.getElementById('geo-thumbnail').value||'',
min_population:Number(document.getElementById('geo-pop').value),
use_divi:document.getElementById('geo-divi').checked,
nb_variants:Number(document.getElementById('geo-variantes').value)||1,
source_text:document.getElementById('geo-source-text').value||'',
competitor_urls:[
document.getElementById('geo-brief-c1').value||'',
document.getElementById('geo-brief-c2').value||'',
document.getElementById('geo-brief-c3').value||''
].filter(Boolean),
brief:{
activite:document.getElementById('geo-brief-activite').value||'',
services:document.getElementById('geo-brief-services').value||'',
mots_clients:document.getElementById('geo-brief-mots').value||'',
},
colors:{
primary:document.getElementById('geo-color-primary').value,
secondary:document.getElementById('geo-color-secondary').value,
light:document.getElementById('geo-color-light').value,
neutre:document.getElementById('geo-color-neutre').value,
cta:document.getElementById('geo-color-cta').value
},
...(selRegs.length>0&&{regions:selRegs}),
...(selDepts.length>0&&{departments:selDepts}),
};
return body;
}

async function previewGeoloc(){
if(!document.getElementById('geo-domain').value||!document.getElementById('geo-kw').value)return;
const siteId=await ensureGeoSite();
if(!siteId){alert('Impossible de trouver/cr\u00e9er le site');return;}
document.getElementById('geo-preview').innerHTML='';document.getElementById('geo-gen-btn').innerHTML='';
try{geoPreview=await apiFetch('/geoloc/preview',{method:'POST',body:JSON.stringify(geoBody(siteId))});}
catch(e){document.getElementById('geo-preview').innerHTML=`<div class="card" style="color:var(--danger)">${e.message}</div>`;return;}
document.getElementById('geo-gen-btn').innerHTML=`<button class="btn" style="background:var(--success)" onclick="generateGeoloc()">G\u00e9n\u00e9rer ${geoPreview.total_pages} pages (~${geoPreview.estimated_cost_eur}\u20AC)</button>`;
let ph=`<div style="font-size:14px;font-weight:600;margin-bottom:10px">${geoPreview.total_pages} pages \u2014 co\u00fbt estim\u00e9 ~${geoPreview.estimated_cost_eur}\u20AC</div><div style="max-height:300px;overflow-y:auto">`;
geoPreview.pages.forEach(p=>{ph+=`<div class="preview-row"><span>${p.keyword}</span><span class="preview-meta">${p.city} (${p.department}) \u2014 ${fmt(p.population)} hab.</span></div>`;});
if(geoPreview.total_pages>20)ph+=`<div style="padding:8px;font-size:11px;color:var(--muted);text-align:center">... et ${geoPreview.total_pages-20} autres</div>`;
ph+=`</div>`;
document.getElementById('geo-preview').innerHTML=ph;
// Auto-expand step 5 if collapsed
const step5=document.getElementById('geo-step5-body');
if(step5&&step5.classList.contains('hidden')){step5.classList.remove('hidden');step5.style.display='';}
}

async function generateFile(){
const domain=document.getElementById('geo-domain').value.trim();
const kw=document.getElementById('geo-kw').value.trim();
if(!domain||!kw){alert('Domaine et mot-cl\u00e9 requis');return;}
const body=geoBuildFullBody();
const statusEl=document.getElementById('geo-file-status');
const progressWrap=document.getElementById('geo-progress-wrap');
const progressBar=document.getElementById('geo-progress-bar');
const progressLabel=document.getElementById('geo-progress-label');
const progressCount=document.getElementById('geo-progress-count');
progressWrap.classList.remove('hidden');
progressBar.style.width='0%';
progressLabel.textContent='G\u00e9n\u00e9ration en cours...';
progressCount.textContent='0/0';
statusEl.innerHTML='';
try{
const res=await apiFetch('/geoloc/build-file',{method:'POST',body:JSON.stringify(body)});
const fileKey=res.file_key;
const total=res.total;
progressCount.textContent=`0/${total}`;
const poll=setInterval(async()=>{
try{
const st=await apiFetch('/geoloc/file-status/'+encodeURIComponent(fileKey));
const pct=st.total>0?Math.round((st.done/st.total)*100):0;
progressBar.style.width=pct+'%';
progressCount.textContent=`${st.done}/${st.total}`;
progressLabel.textContent=`G\u00e9n\u00e9ration : ${pct}%`;
if(st.status==='done'){
clearInterval(poll);
progressBar.style.width='100%';
progressLabel.textContent='Termin\u00e9 !';
progressCount.textContent=`${st.total}/${st.total}`;
statusEl.innerHTML=`<div class="card result-box" style="margin-top:12px"><div class="result-msg">${total} pages g\u00e9n\u00e9r\u00e9es avec succ\u00e8s</div><div style="margin-top:10px"><a href="/geoloc/download/${encodeURIComponent(fileKey)}" class="btn" style="text-decoration:none;display:inline-block;background:var(--success)">T\u00e9l\u00e9charger le fichier Excel</a></div></div>`;
}
}catch(e){clearInterval(poll);progressLabel.textContent='Erreur';statusEl.innerHTML=`<div class="card" style="color:var(--danger);margin-top:8px">${e.message}</div>`;}
},2000);
}catch(e){progressWrap.classList.add('hidden');statusEl.innerHTML=`<div class="card" style="color:var(--danger)">${e.message}</div>`;}
}

async function generateGeoloc(){
const siteId=await ensureGeoSite();
if(!siteId)return;
try{const res=await apiFetch('/geoloc/generate',{method:'POST',body:JSON.stringify(geoBody(siteId))});
document.getElementById('geo-result').innerHTML=`<div class="card result-box"><div class="result-msg">${res.message}</div><div class="result-sub">Visible dans la file de validation (Overview)</div></div>`;
}catch(e){document.getElementById('geo-result').innerHTML=`<div class="card" style="color:var(--danger)">${e.message}</div>`;}
}

</script>
